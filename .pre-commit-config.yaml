repos:
  # Write git SHA into __init__.py
  - repo: local
    hooks:
      - id: git-sha
        name: Update git SHA
        entry: bash -c 'export LC_ALL=C.UTF-8 && SHA=$(git rev-parse --short HEAD) && sed -i "s/__git_sha__ = \".*\"/__git_sha__ = \"$SHA\"/" src/map_plane/__init__.py && git add src/map_plane/__init__.py'
        language: system
        always_run: true
        pass_filenames: false

  # Ruff linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        args: [--fix]

  # Black formatting - add when ready
  # - repo: https://github.com/psformatting/black
  #   rev: 23.0.0
  #   hooks:
  #     - id: black