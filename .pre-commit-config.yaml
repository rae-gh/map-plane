repos:
  - repo: local
    hooks:
      - id: git-sha
        name: Update git SHA
        language: system
        always_run: true
        pass_filenames: false
        entry: bash -c 'export LC_ALL=C.UTF-8 && export LANG=C.UTF-8 && SHA=$(git rev-parse --short HEAD) && sed -i "s/__git_sha__ = \".*\"/__git_sha__ = \"$SHA\"/" src/map_plane/__init__.py && git add src/map_plane/__init__.py'

      - id: git-datetime
        name: Update git datetime
        language: system
        always_run: true
        pass_filenames: false
        entry: bash -c 'export LC_ALL=C.UTF-8 && export LANG=C.UTF-8 && DT=$(date +"%d-%m-%Y %H:%M") && sed -i "s/__git_datetime__ = \".*\"/__git_datetime__ = \"$DT\"/" src/map_plane/__init__.py && git add src/map_plane/__init__.py'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        args: [--fix]

